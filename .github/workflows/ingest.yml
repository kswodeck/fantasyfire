name: Ingest NBA + MLB + NFL + NHL + WNBA + soccer data

# Pulls stats.nba.com (playerindex + leaguegamelog), statsapi.mlb.com, and ESPN's
# hidden football/nfl API, and upserts into Postgres.
#
# WHY GITHUB ACTIONS (not Vercel): stats.nba.com frequently blocks AWS/Vercel/
# cloud IP ranges, so the NBA ingest must NOT run from a Vercel function. GitHub
# Actions runners usually work, but their IPs are *occasionally* blocked too.
# If a run fails with NbaLikelyBlockedError (every request timed out), that is
# the IP block — not a code bug. Fallbacks, in order of effort:
#   1. Re-run the job (block is often transient / IP-specific).
#   2. Run the ingest from a small always-on VPS or locally on a cron.
#   3. Implement the documented ESPN fallback client (see docs/PLAN.md §2).
# Do NOT fabricate or stub data to work around the block. statsapi.mlb.com is
# generally NOT IP-blocked, so the MLB step runs even if the NBA step fails.
#
# Migrations are NOT run here — they live in migrate.yml (push to main), so a
# schema change or DB hiccup can't block the data pull. This job only reads/writes
# data, so it needs just the pooled app connection (no DIRECT_URL).
#
# REQUIRED secret (stored on the "Production" environment):
#   DATABASE_URL  — pooled app connection (Supabase transaction pooler, :6543), sslmode=require

on:
  schedule:
    # 9:00 UTC daily (~early morning US) — after the prior night's games settle.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # DATABASE_URL is stored on the "Production" environment, so the job must
    # declare it to access the secret. The environment's branch rule allows
    # `main`, which is where the schedule/dispatch runs.
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
      # Seasons are computed from the date in code. Set the NBA_SEASON / MLB_SEASON
      # repo variables only to force a specific season (e.g. backfill).
      NBA_SEASON: ${{ vars.NBA_SEASON || '' }}
      MLB_SEASON: ${{ vars.MLB_SEASON || '' }}
      NFL_SEASON: ${{ vars.NFL_SEASON || '' }}
      NHL_SEASON: ${{ vars.NHL_SEASON || '' }}
      WNBA_SEASON: ${{ vars.WNBA_SEASON || '' }}
      EPL_SEASON: ${{ vars.EPL_SEASON || '' }}
      MLS_SEASON: ${{ vars.MLS_SEASON || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fail fast with an actionable message if the DB secret is missing,
      # instead of Prisma's cryptic "Connection url is empty".
      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set."
            echo "Add it on the Production environment (the Supabase transaction pooler URL, :6543, with sslmode=require)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run NBA ingest
        id: nba_ingest
        run: pnpm ingest

      # MLB uses statsapi.mlb.com (not IP-blocked), so refresh it even when the
      # NBA step fails on a transient cloud-IP block. Skipped if earlier setup
      # failed. The job still reports failure if NBA failed.
      - name: Run MLB ingest
        if: ${{ success() || steps.nba_ingest.outcome == 'failure' }}
        run: pnpm ingest:mlb

      # NFL via ESPN's hidden football/nfl API. ESPN is generally NOT IP-blocked
      # (it's the documented NBA fallback host), so run it regardless of whether
      # the NBA step hit a cloud-IP block. In the off-season it pulls 0 completed
      # games (a harmless no-op) until the season starts.
      - name: Run NFL ingest
        if: ${{ success() || failure() }}
        run: pnpm ingest:nfl

      # The ESPN-native sports (hockey/nhl, basketball/wnba, soccer/eng.1 + usa.1)
      # share one config-driven runner. Each walks the scoreboard incrementally
      # (first run backfills the season); off-season pulls are harmless no-ops.
      - name: Run NHL ingest
        if: ${{ success() || failure() }}
        run: pnpm ingest:nhl

      - name: Run WNBA ingest
        if: ${{ success() || failure() }}
        run: pnpm ingest:wnba

      - name: Run EPL ingest
        if: ${{ success() || failure() }}
        run: pnpm ingest:epl

      - name: Run MLS ingest
        if: ${{ success() || failure() }}
        run: pnpm ingest:mls

      # Free schedule feed (statsapi.mlb.com + ESPN scoreboard) for the "tonight"
      # slate. Best-effort and non-fatal — runs even if an ingest step failed.
      - name: Pull schedule
        if: ${{ success() || failure() }}
        run: pnpm schedule

      # Ping IndexNow (Bing/Yandex/DDG) with tonight's changed URLs — changed
      # player pages + in-season boards — for near-instant recrawl. Best-effort
      # and non-fatal; Google ignores IndexNow (the sitemap covers it). Needs
      # NEXT_PUBLIC_SITE_URL to be the public apex (skips on localhost).
      - name: Ping IndexNow
        if: ${{ success() || failure() }}
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://fantasyfire.app' }}
        run: pnpm indexnow

      # Nightly retention prune — drop ProvidedLine rows older than 30d and IngestRun
      # rows older than 90d (safe windows; see src/ingest/run-prune.ts). Keeps the DB
      # lean without a separate cron. Best-effort + non-fatal so a prune hiccup never
      # fails the data pipeline.
      - name: Prune old data
        if: ${{ success() || failure() }}
        run: pnpm db:prune
