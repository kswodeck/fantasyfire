name: Ingest provided lines (PrizePicks + Underdog)

# Scrapes DFS pick'em lines into the PROD `ProvidedLine` table on a schedule, so the
# real lines stay fresh WITHOUT a local machine being on. This is the SOLE ingest path
# (the old Windows scheduled task is retired — the probe confirmed GitHub runners reach
# PrizePicks/Underdog directly, no proxy needed).
#
# ⚠️ PrizePicks/Underdog BLOCK datacenter IPs, so GitHub's runners may be refused
# (HTTP 403). First run this via "Run workflow" and check the logs:
#   • "[providedlines] upserted N ..."  → the runner IP works; you're done (free).
#   • fetch failures / HTTP 403         → set the SCRAPE_PROXY_URL secret to a
#       residential proxy / web-unblocker; the scrapers route through it (src/ingest/
#       scrapeFetch.ts). Re-run to confirm.
#
# NOTE: scheduled + manual runs only fire from the DEFAULT branch (main), so this
# only starts running once it's on main (it lands there when you merge develop -> main).
#
# Time-aware cadence. GitHub cron is UTC-only and can't follow daylight saving, so
# this is anchored to PDT (UTC-7), the current Pacific offset:
#   - PEAK 8AM-9PM PDT (15:00-04:00 UTC): every 15 min — from ~2h before the Sunday
#     early NFL slate (1PM ET) through the latest NBA tip-offs (~8PM PT).
#   - OFF-PEAK overnight lull: just 07:00 + 13:00 UTC (= midnight + 6AM PDT).
# ~54 runs/day (~1.6k min/month; under the 2,000 free tier on a PRIVATE repo).
# When DST ends (early Nov 2026) the wall-clock window shifts to 7AM-8PM PST until
# spring — bump every UTC hour here +1 to restore 8AM-9PM. GitHub schedules are
# best-effort: high-frequency crons can slip 5-15 min or skip under load, so 15 min
# is a ceiling, not a guarantee. Use "Run workflow" for an on-demand refresh.
#
# Secrets (Production environment):
#   DATABASE_URL      — prod transaction-pooler URL (:6543, sslmode=require)
#   SCRAPE_PROXY_URL  — (optional) residential proxy, e.g. http://user:pass@host:port

on:
  schedule:
    # PEAK 8AM-9PM PDT = 15:00-04:00 UTC — every 15 min (hours 15-23, then 00-03).
    - cron: '*/15 15-23 * * *'
    - cron: '*/15 0-3 * * *'
    # OFF-PEAK overnight lull — 07:00 + 13:00 UTC (= midnight + 6AM PDT).
    - cron: '0 7,13 * * *'
  workflow_dispatch: {}

concurrency:
  group: ingest-providedlines
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DATABASE_URL secret lives on the Production environment (same as ingest.yml).
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set on the Production environment."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest provided lines
        run: pnpm ingest:providedlines
