name: Ingest provided lines + injuries (PrizePicks + Underdog + RotoWire + ESPN)

# Scrapes player-prop lines into the PROD `ProvidedLine` table on a schedule, so the
# real lines stay fresh WITHOUT a local machine being on (the old Windows task is
# retired). Sources: PrizePicks + Underdog (direct) and RotoWire's public picks
# aggregator (adds Sleeper, DraftKings Pick6, RT Sports + sportsbooks). All reach
# GitHub's runners directly — NO proxy, no residential dependency.
#
# Also refreshes player injury / availability (`PlayerInjury`) from the public ESPN
# feed on the same cadence — both are fast, slate-relevant reads that change intraday.
#
# NOTE: scheduled + manual runs only fire from the DEFAULT branch (main), so this
# only starts running once it's on main (it lands there when you merge develop -> main).
#
# CADENCE LIVES OUTSIDE THIS FILE. cron-job.org calls the workflow_dispatch endpoint
# on a schedule it actually honours; see docs/CRON.md for the schedule, the setup and
# the measurements behind the move. The `schedule:` block below is only a fallback.
#
# The intent it implements (Eastern wall-clock, since the slate is US-evening shaped):
#   - late morning / midday : a couple of warm-up pulls
#   - afternoon             : lines firming up
#   - 7:00pm-11:00pm ET     : peak, every 30 min — evening slates in play
#   - overnight             : one cheap keep-warm
# Because the external scheduler fires reliably, the peak tier is now a real 30-minute
# ceiling rather than an aspiration. Use "Run workflow" for an on-demand refresh.
#
# Minutes still matter: Actions bills each job rounded UP to the minute, this job's
# measured median is 3.2 min (so 4 billed), and in Aug 2026 the account hit its billing
# cap and STOPPED ALLOCATING RUNNERS entirely — every job failed in seconds with
# "recent account payments have failed or your spending limit needs to be increased".
# Provided-lines was ~90% of that burn. docs/CRON.md carries the per-plan budget, so
# adding external ticks is a costed decision rather than a guess.
#
# DST: when EST begins (early Nov 2026) the whole day shifts an hour earlier in ET.
# The schedule that needs the +1 UTC bump now lives in cron-job.org, not here — the two
# fallback ticks below are deliberately time-of-day agnostic, so they need no seasonal
# edit. See docs/CRON.md.
#
# Secret (Production environment):
#   DATABASE_URL  — prod transaction-pooler URL (:6543, sslmode=require)
# Optional (only to enable on-demand ISR revalidation when provided lines are live):
#   REVALIDATE_SECRET (secret)            — same value set on the Vercel deployment
#   NEXT_PUBLIC_SITE_URL (variable)       — public site origin, e.g. https://fantasyfire.app
#   PROVIDED_LINES_ENABLED (variable)     — "true" to ping revalidation for moved lines

on:
  # SPARSE FALLBACK ONLY — the real cadence comes from cron-job.org, which calls this
  # workflow's `workflow_dispatch` endpoint. See docs/CRON.md for the why and the setup.
  #
  # Short version: GitHub's scheduled-workflow queue is best-effort and silently DROPS
  # runs. Measured over 2026-08-29..31, this workflow declared 30 runs/day and actually
  # fired 9 on a complete day — a 70% drop rate, median 26 min late (worst 120), with a
  # median gap of 144 min between runs and one gap of 403 min against a schedule that
  # intends 20-30. The board was going hours stale behind a green pipeline.
  #
  # These two entries are a dead-man's-switch, not the schedule: if the cron-job.org
  # account lapses or its token expires, the pipeline degrades to a couple of runs a day
  # instead of silently stopping. Deliberately at 05:00/13:00 UTC, which the recommended
  # external schedule does not use, so a fallback tick never collides with an external
  # one (cancel-in-progress would otherwise let them kill each other).
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch: {}

# NEWEST RUN WINS. This was `cancel-in-progress: false`, and that queued rather than
# replaced — which let a SINGLE stuck run wedge the whole pipeline silently for 8 days:
#
#   run #509 (2026-08-06 16:05Z) entered `waiting` on the Production environment gate
#   and never came out. Holding the group, it blocked runs #510-#644 — about 135 of
#   them — each created `pending`, never allocated a job, and cancelled the moment the
#   next schedule fired. No book lines were written after run #508, the ProvidedLine
#   rows aged out of the board's 3-day window, and the site fell back to its own median
#   lines with every ingest "cancelled" rather than failed.
#
# Queueing is the wrong policy for this job regardless of that incident. It is
# idempotent and it re-scrapes the CURRENT slate every time, so a backlog of stale runs
# has no value — if one is somehow still going when the next fires, the newer scrape is
# strictly better. Cancelling in progress also makes the wedge self-healing: whatever
# leaves a run stuck, the next schedule clears it instead of piling up behind it.
#
# Safe against cancelling healthy work: the job's timeout-minutes is 10 and the tightest
# cron gap is 20 minutes, so a run that is progressing normally has always finished
# before its successor arrives. That margin used to be thin in practice — the scrape hit
# all five books sequentially and took ~9.5 min, so runs were dying ON the timeout (some
# after their work had already succeeded, billing the full 10 min for a red X). The
# sources are fetched concurrently now, so a healthy run lands in a couple of minutes.
concurrency:
  group: ingest-providedlines
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DATABASE_URL secret lives on the Production environment (same as ingest.yml).
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Optional on-demand ISR revalidation. When all three are set (and the SAME
      # REVALIDATE_SECRET is on the Vercel deploy), the ingest pings the site to
      # revalidate ONLY the player/stat pages whose line actually moved. All inert
      # if unset — the run just skips the ping. See .env.example.
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Fallback matches social.yml — without it the var resolves empty here and
      # every post-ingest revalidation ping is skipped ("bad-site-url").
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://fantasyfire.app' }}
      PROVIDED_LINES_ENABLED: ${{ vars.PROVIDED_LINES_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set on the Production environment."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest provided lines
        run: pnpm ingest:providedlines

      # Runs even if the lines step failed — injuries are independent (ESPN feed).
      - name: Ingest injuries
        if: always()
        run: pnpm ingest:injuries
