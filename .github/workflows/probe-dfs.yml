name: Probe DFS reachability (PrizePicks/Underdog)

# One-off check: can a GitHub Actions runner reach PrizePicks + Underdog, or do their
# Cloudflare/anti-bot layers block datacenter IPs? This decides whether the cloud
# ingest cron can run "direct" (free) or needs a residential proxy. No DB writes, no
# secrets — just prints the HTTP status + payload size for each endpoint.
#
# Run it from the Actions tab → "Run workflow". 200s = reachable (the cron can run
# directly); 403/429/timeouts = blocked → use a residential proxy (SCRAPE_PROXY_URL).
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit PrizePicks + Underdog and report status
        run: |
          node - <<'NODE'
          (async () => {
            const UA =
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
            const probe = async (name, url, headers) => {
              try {
                const r = await fetch(url, { headers });
                const body = await r.text();
                console.log(`${name}: HTTP ${r.status} (${body.length} bytes)`);
              } catch (e) {
                console.log(`${name}: ERROR ${e.message}`);
              }
            };
            await probe(
              'PrizePicks partner-api (MLB)',
              'https://partner-api.prizepicks.com/projections?league_id=2&per_page=50',
              { 'User-Agent': UA, Accept: 'application/json', Origin: 'https://app.prizepicks.com', Referer: 'https://app.prizepicks.com/' },
            );
            await probe(
              'Underdog (MLB)',
              'https://api.underdogfantasy.com/beta/v5/over_under_lines?sport_id=MLB',
              { 'User-Agent': UA, Accept: 'application/json', Origin: 'https://underdogfantasy.com', Referer: 'https://underdogfantasy.com/' },
            );
            console.log('\\nReadout: a few-MB 200 = reachable (cron can run direct). 403/429 = blocked → use SCRAPE_PROXY_URL.');
          })();
          NODE