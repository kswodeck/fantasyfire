name: Apply DB migrations

# Runs `prisma migrate deploy` against the production database. Split out from the
# nightly ingest so a schema change (or a DB hiccup) can never block the data pull,
# and so migrations run only when they actually change — not every night.
#
# Triggers:
#   - push to `main` that touches the schema/migrations (the normal path: a
#     migration is applied when it merges to main, alongside the Vercel deploy)
#   - manual dispatch (re-run, or apply out of band)
#
# REQUIRED secret (stored on the "Production" environment):
#   DIRECT_URL — the migration connection. Prefer the Supabase SESSION pooler
#                (:5432) or a direct connection. `migrate deploy` takes a
#                session-level advisory lock the TRANSACTION pooler (:6543) can't
#                hold, so :6543 would hang — but the "Resolve migration connection"
#                step auto-corrects a :6543 url to the :5432 session pooler, so a
#                transaction-pooler secret still works (with a warning).

on:
  push:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch: {}

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # DIRECT_URL lives on the "Production" environment.
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve migration connection
        env:
          RAW_DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$RAW_DIRECT_URL" ]; then
            echo "::error::DIRECT_URL secret is not set. Add it on the Production environment (Settings → Environments → Production)."
            exit 1
          fi
          # `migrate deploy` takes a session-level advisory lock that PgBouncer's
          # TRANSACTION pooler (:6543) cannot hold, so it hangs until timeout.
          # Supabase's SESSION pooler is the SAME url on :5432, so auto-correct a
          # :6543 secret instead of failing — the migration then runs regardless.
          # (Set DIRECT_URL to the :5432 session pooler to silence the warning.)
          # A password can't contain a literal ":6543" — the colon would be
          # URL-encoded — so the only ":6543" in the string is the port.
          MIGRATE_URL="$RAW_DIRECT_URL"
          if printf '%s' "$RAW_DIRECT_URL" | grep -q ':6543'; then
            MIGRATE_URL="$(printf '%s' "$RAW_DIRECT_URL" | sed 's/:6543/:5432/')"
            echo "::warning::DIRECT_URL points at the transaction pooler (:6543); using the :5432 session pooler for this run. Update the secret to the session pooler to silence this."
          fi
          # Never print the resolved URL; it carries the DB password.
          echo "::add-mask::$MIGRATE_URL"
          echo "DIRECT_URL=$MIGRATE_URL" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        # migrate deploy normally finishes in seconds; cap it so a hung/bad
        # connection fails fast instead of running to the job timeout.
        timeout-minutes: 5
        run: pnpm db:deploy
