name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint + typecheck + unit tests on every push/PR. No build here: the production
# build runs `generateStaticParams`, which queries Postgres, so it belongs in the
# deploy pipeline (Vercel) with DB access — not in plain CI.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # `postinstall` runs `prisma generate` (no DB connection needed).

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
